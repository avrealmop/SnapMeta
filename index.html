<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapMeta — Legal &amp; Licensing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", -apple-system, "Helvetica Neue", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #161b22;
      border: 1px solid #21262e;
      border-radius: 16px;
      padding: 48px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    .logo {
      width: 128px;
      height: 128px;
      margin: 0 auto 20px;
      display: block;
    }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    p.sub { color: #8b949e; font-size: 14px; margin-bottom: 28px; }
    a.link {
      display: block;
      text-decoration: none;
      color: #e6edf3;
      background: #21262e;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      font-size: 15px;
      transition: border-color .15s, background .15s;
    }
    a.link:hover { background: #282e36; border-color: #aff33e; }
    a.link .badge {
      display: inline-block;
      float: right;
      font-size: 11px;
      color: #aff33e;
      border: 1px solid #aff33e44;
      border-radius: 999px;
      padding: 2px 10px;
      margin-top: 1px;
    }
    footer { margin-top: 20px; font-size: 12px; color: #484f58; }
  </style>
</head>
<body>
  <div class="card">
    <img
      class="logo"
      src="assets/logo/app_logo_1024.png"

    <a class="link" href="AGPL-3.0.html" style="color:#9ecbff">AGPL-3.0 License</a>
    <footer>SnapMeta &middot; v1.0.4</footer>
  </div>
</body>
</html>
